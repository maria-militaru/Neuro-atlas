<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Maria's Neuro Atlas</title>
<meta name="description" content="An interactive 3D brain atlas built from a real MRI: cut it, split it, explode it, quiz yourself and see how disease changes it.">
<meta property="og:title" content="Maria's Neuro Atlas">
<meta property="og:description" content="Explore a real human brain in 3D. Cut, label, quiz and learn.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#020309">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ffb1a6'/%3E%3Cstop offset='.5' stop-color='%239ca8ff'/%3E%3Cstop offset='1' stop-color='%235fe3a1'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='url(%23g)' stroke-width='6'/%3E%3C/svg%3E">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;background:#020309}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed 3D stage; glass tool rail left, atlas/quiz rail right; bottom sheets under 900px.
   Look: one committed dark world, ink-violet night with the cortex as the warm object. */
:root{
  --bg:#07080f;
  --bg-2:#0e1020;
  --glass:rgba(15,17,31,.74);
  --glass-hi:rgba(26,29,52,.86);
  --line:rgba(158,168,255,.15);
  --line-hi:rgba(158,168,255,.34);
  --fg:#ebeaf4;
  --fg-2:#aaa9c4;
  --fg-3:#72718f;
  --acc:#9ca8ff;
  --acc-ink:#0b0d1d;
  --good:#5fe3a1;
  --bad:#ff6b8a;
  --warn:#ffc46b;
  --f-display:'Instrument Serif','Iowan Old Style',Georgia,serif;
  --f-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,p{margin:0}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:
  radial-gradient(60% 50% at 50% 42%,rgba(40,90,220,.10),transparent 70%),
  radial-gradient(130% 70% at 50% 112%,rgba(24,60,160,.22) 0%,transparent 60%),
  linear-gradient(#020309,#010207 55%,#02040d)}
#app[data-bg="space"]{background:
  radial-gradient(70% 55% at 50% 40%,rgba(40,110,255,.22),transparent 70%),
  radial-gradient(130% 80% at 50% 108%,rgba(30,90,220,.5) 0%,rgba(14,40,110,.25) 35%,transparent 62%),
  radial-gradient(90% 60% at 85% 0%,rgba(20,70,160,.28),transparent 70%),
  linear-gradient(#030817,#02040c 55%,#040b20)}
#app[data-bg="nebula"]{background:
  radial-gradient(70% 60% at 50% 42%,rgba(120,110,255,.16),transparent 70%),
  radial-gradient(120% 90% at 50% 100%,#12142b 0%,transparent 60%),
  linear-gradient(#090a14,#05060b)}
#app[data-bg="black"]{background:#000}
#app[data-bg="slate"]{background:radial-gradient(80% 70% at 50% 45%,#2a2f3a,#14171d 75%)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches button{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.25);padding:0;background:var(--c)}
.swatches button:hover{border-color:#fff}
.swatches button.on{border-color:#fff;box-shadow:0 0 0 3px var(--acc)}
.swpick{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--fg-2);cursor:pointer}
.swpick input{width:34px;height:28px;padding:0;border:1px solid var(--line-hi);border-radius:8px;background:none;cursor:pointer}
.swpick.on span{color:var(--fg);font-weight:600}
#app[data-light] .brand-name{color:#1c1730}
#app[data-light] .orient{color:#3b3352;font-weight:600}
#app[data-light] .orient b,#app[data-light] .orient i{color:#4a2fc4;opacity:1}
#app[data-light] #hint{color:#3b3352}
#app[data-light] .callout .ln{background:linear-gradient(90deg,#1c1730,rgba(28,23,48,.5))}
#app[data-light] .callout .pin{box-shadow:0 0 0 4px rgba(28,23,48,.18)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:grab}
#gl.drag{cursor:grabbing}
#gl.hot{cursor:pointer}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}

/* top bar */
#top{position:absolute;left:16px;right:16px;top:12px;display:flex;align-items:center;gap:18px;z-index:5;pointer-events:none}
#top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:22px;height:22px;border-radius:50%;background:conic-gradient(from 210deg,#ffb1a6,#9ca8ff,#5fe3a1,#ffb1a6);-webkit-mask:radial-gradient(circle at 50% 50%,transparent 5px,#000 6px);mask:radial-gradient(circle at 50% 50%,transparent 5px,#000 6px)}
.brand-name{font-family:var(--f-display);font-size:25px;letter-spacing:.2px;line-height:1}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:rgba(10,11,22,.7);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;backdrop-filter:blur(14px)}
.seg button{background:none;border:0;padding:7px 14px;border-radius:8px;color:var(--fg-2);font-weight:500;font-size:13px;white-space:nowrap}
.seg button:hover{color:var(--fg)}
.seg button.on{background:var(--acc);color:var(--acc-ink);font-weight:600}
.seg.four button,.seg.three button{padding:7px 4px;font-size:12.5px}
.sheet-tabs{display:none;margin-left:auto}

/* panels */
.panel{position:absolute;z-index:4;background:var(--glass);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(20px) saturate(1.25);-webkit-backdrop-filter:blur(20px) saturate(1.25);box-shadow:0 20px 60px rgba(0,0,0,.45);overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--line-hi) transparent}
#tools{left:16px;top:64px;bottom:16px;width:286px;padding:6px 16px 16px}
#side{right:16px;top:64px;bottom:16px;width:356px;padding:0}
#app[data-mode="quiz"] #tools,#app[data-mode="disease"] #tools{display:none}
.grp{padding:14px 0 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:11px}
.grp:last-child{border-bottom:0}
.grp h3{font:500 10.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{background:rgba(158,168,255,.08);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:500;font-size:13px;color:var(--fg);transition:background .15s,border-color .15s}
.btn:hover{background:rgba(158,168,255,.16);border-color:var(--line-hi)}
.btn.primary{background:var(--acc);border-color:transparent;color:var(--acc-ink);font-weight:600}
.btn.primary:hover{background:#b6bfff}
.btn.wide{width:100%}
.btn:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.grp h3.sub{margin-top:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--fg-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.rng{display:grid;grid-template-columns:1fr auto;gap:6px 8px;align-items:center;font-size:12.5px;color:var(--fg-2)}
.rng output{font:500 11.5px var(--f-mono);color:var(--fg);font-variant-numeric:tabular-nums}
.rng input{grid-column:1/-1}
.rng[hidden]{display:none}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--acc) var(--p,0%),rgba(158,168,255,.18) var(--p,0%))}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:rgba(158,168,255,.18)}
input[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:var(--acc)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-6px;border-radius:50%;background:#fff;border:3px solid var(--acc);box-shadow:0 2px 8px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--acc)}
.chk,.sw{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--fg-2);cursor:pointer;user-select:none}
.chk input{accent-color:var(--acc);width:15px;height:15px;margin:0}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw i{width:30px;height:18px;border-radius:12px;background:rgba(158,168,255,.18);position:relative;flex:none;transition:background .15s}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#cfd2ee;transition:transform .15s,background .15s}
.sw input:checked+i{background:var(--acc)}
.sw input:checked+i::after{transform:translateX(12px);background:#fff}
.sw input:focus-visible+i{outline:2px solid var(--acc);outline-offset:2px}
.sw:hover span,.chk:hover span{color:var(--fg)}

/* info card */
.info{padding:20px 20px 16px;border-bottom:1px solid var(--line)}
.info.empty{color:var(--fg-2)}
.info .kick{font:500 10.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3);display:flex;align-items:center;gap:8px;margin-bottom:10px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--c,#999);box-shadow:0 0 12px var(--c,#999)}
.info h2{font:400 31px/1.05 var(--f-display);letter-spacing:.1px;text-wrap:balance}
.info h2 em{font-style:italic;color:var(--fg-2)}
.info p{margin-top:10px;color:var(--fg-2);font-size:13.5px;line-height:1.55;max-width:62ch}
.info dl{margin:14px 0 0;display:grid;gap:10px}
.info dt{font:500 10px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3);margin-bottom:5px}
.info dd{margin:0;font-size:13px;color:var(--fg);line-height:1.5}
.info .tools{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.info .tiny{margin-top:8px;font-size:12px;color:var(--fg-3)}
.info details{margin-top:14px;border-top:1px solid var(--line);padding-top:10px;font-size:12.5px;color:var(--fg-2)}
.info details summary{cursor:pointer;font:500 10.5px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3)}
.info details ul{margin:10px 0 0;padding-left:16px;display:grid;gap:7px;line-height:1.5}
.info details p.tiny{margin-top:10px}
.parts{padding:6px 8px 12px}
.pg{margin-top:6px}
.pg h4{margin:10px 12px 4px;font:500 10px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3)}
.pr{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 12px;border-radius:9px;cursor:pointer;color:var(--fg-2);font-size:13px}
.pr:hover{background:rgba(158,168,255,.09);color:var(--fg)}
.pr.sel{background:rgba(158,168,255,.16);color:var(--fg)}
.pr .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr.off .nm{opacity:.4;text-decoration:line-through}
.eye{background:none;border:0;padding:4px;border-radius:6px;color:var(--fg-3);display:grid;place-items:center}
.eye:hover{color:var(--fg);background:rgba(158,168,255,.12)}
.eye svg{width:16px;height:16px;display:block}

/* floating labels */
.callout{position:absolute;left:0;top:0;display:flex;align-items:center;pointer-events:none;will-change:transform}
.callout .pin{width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid var(--c,#9ca8ff);box-shadow:0 0 0 4px rgba(255,255,255,.12),0 0 18px var(--c,#9ca8ff);flex:none;margin:-4.5px 0 0 -4.5px}
.callout .ln{position:absolute;left:0;top:0;height:1.5px;width:44px;background:linear-gradient(90deg,#fff,rgba(255,255,255,.4));transform-origin:0 50%;transform:rotate(-32deg)}
.callout .tag{position:absolute;left:38px;top:-44px;white-space:nowrap;background:rgba(10,11,24,.88);border:1px solid var(--c,#9ca8ff);border-radius:9px;padding:6px 11px;backdrop-filter:blur(8px)}
.callout .tag b{display:block;font:400 17px/1.1 var(--f-display);color:#fff}
.callout .tag span{font:500 9.5px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--fg-2)}
.tagall{position:absolute;left:0;top:0;white-space:nowrap;font:500 10px/1 var(--f-mono);letter-spacing:.06em;color:#fff;background:rgba(8,9,20,.72);border:1px solid var(--line-hi);border-radius:6px;padding:4px 6px;pointer-events:none;will-change:transform}
.orient{position:absolute;left:0;top:0;font:500 10px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--fg-3);pointer-events:none;will-change:transform;text-align:center}
.orient{line-height:1.5;color:var(--fg-2)}
.orient i{display:block;font-style:normal;color:var(--acc);opacity:.85}
.orient b{display:block;font:500 12px var(--f-mono);color:var(--acc);letter-spacing:.1em}
.tip{position:absolute;z-index:6;pointer-events:none;background:rgba(10,11,24,.92);border:1px solid var(--line-hi);color:var(--fg);padding:5px 9px;border-radius:8px;font-size:12.5px;white-space:nowrap}
#app[data-mode="quiz"] #hint,#app[data-mode="disease"] #hint{display:none}
#hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:3;font:500 11px var(--f-mono);letter-spacing:.06em;color:var(--fg-3);pointer-events:none;white-space:nowrap;transition:opacity .6s}
#hint.gone{opacity:0}

/* quiz */
#quizSide{padding:16px 18px 18px;display:flex;flex-direction:column;gap:14px}
.decks{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:rgba(158,168,255,.07);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:500;color:var(--fg-2)}
.chip:hover{color:var(--fg);border-color:var(--line-hi)}
.chip.on{background:var(--acc);color:var(--acc-ink);border-color:transparent;font-weight:600}
.qmeta{display:flex;align-items:center;justify-content:space-between;font:500 11px var(--f-mono);letter-spacing:.08em;color:var(--fg-3);text-transform:uppercase}
.qmeta b{color:var(--fg);font-weight:500}
.ring{display:flex;gap:4px}
.ring i{width:18px;height:4px;border-radius:3px;background:rgba(158,168,255,.18)}
.ring i.ok{background:var(--good)}
.ring i.no{background:var(--bad)}
.qcard{display:flex;flex-direction:column;gap:12px}
.qtag{font:500 10.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.qcard h2{font:400 29px/1.08 var(--f-display);text-wrap:balance}
.qsub{color:var(--fg-2);font-size:13px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:rgba(158,168,255,.06);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:14px;font-weight:500;transition:background .12s,border-color .12s,transform .12s}
.opt kbd{font:500 10.5px var(--f-mono);width:20px;height:20px;border-radius:6px;border:1px solid var(--line-hi);display:grid;place-items:center;color:var(--fg-3);flex:none}
.opt:hover:not(:disabled){background:rgba(158,168,255,.14);border-color:var(--line-hi)}
.opt:disabled{cursor:default}
.opt.right{background:rgba(95,227,161,.14);border-color:var(--good)}
.opt.right kbd{background:var(--good);border-color:var(--good);color:#06150e}
.opt.wrong{background:rgba(255,107,138,.14);border-color:var(--bad)}
.opt.wrong kbd{background:var(--bad);border-color:var(--bad);color:#1a050b}
.opt.dim{opacity:.45}
.feed{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.verdict{font:400 24px/1.1 var(--f-display)}
.verdict.good{color:var(--good)}
.verdict.bad{color:var(--bad)}
.feed p{color:var(--fg-2);font-size:13.5px;line-height:1.55}
.feed p b{color:var(--fg);font-weight:600}
.qstats{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;border-top:1px solid var(--line);padding-top:14px}
.qs{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--fg-2)}
.qs .bar{height:4px;border-radius:3px;background:rgba(158,168,255,.16);overflow:hidden}
.qs .bar i{display:block;height:100%;background:var(--acc);width:0}
.qs span b{font:500 11px var(--f-mono);color:var(--fg);float:right}
.linkbtn{background:none;border:0;color:var(--fg-3);font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 0;text-align:left}
.linkbtn:hover{color:var(--fg)}

#loading{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:linear-gradient(#030817,#02040c);transition:opacity .7s,visibility .7s}
#loading.gone{opacity:0;visibility:hidden}
.ld-mark{width:54px;height:54px;border-radius:50%;background:conic-gradient(from 210deg,#ffb1a6,#9ca8ff,#5fe3a1,#ffb1a6);-webkit-mask:radial-gradient(circle,transparent 13px,#000 14px);mask:radial-gradient(circle,transparent 13px,#000 14px);animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#ldText{font:400 22px var(--f-display);color:var(--fg-2)}
.ld-bar{width:180px;height:3px;background:rgba(158,168,255,.16);border-radius:3px;overflow:hidden}
.ld-bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
.nogl{padding:40px;max-width:520px;margin:auto;color:var(--fg-2)}

.info details+details{margin-top:10px}
.info details dl{margin-top:12px}
.info details ul.reads{list-style:none;padding:0;gap:10px}
.reads a{color:var(--acc);text-decoration:none;font-weight:500;font-size:13px;line-height:1.35}
.reads a:hover{text-decoration:underline}
.reads span{display:block;color:var(--fg-3);font-size:11.5px;margin-top:2px}
.reads li.sep{border-top:1px solid var(--line);padding-top:10px;font:500 10px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3)}
.seg.wrap{display:flex;flex-wrap:wrap}
.seg.wrap button{flex:1 1 30%;padding:7px 4px;font-size:12.5px}
.legend button{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:2px 0;font-size:11.5px;color:var(--fg-2);text-align:left}
.legend button:hover{color:var(--fg)}
.note{font-size:12px;color:var(--fg-3);line-height:1.45}
.tagall.sulc{pointer-events:auto;cursor:pointer;border-color:var(--c,var(--line-hi));background:rgba(8,9,20,.84)}
.recall{display:flex;flex-direction:column;gap:10px}
.recall input,.recall textarea{font:inherit;font-size:16px;color:var(--fg);background:rgba(158,168,255,.06);border:1px solid var(--line-hi);border-radius:12px;padding:11px 13px;width:100%;resize:vertical}
.recall input::placeholder,.recall textarea::placeholder{color:var(--fg-3)}
.recall input.right{border-color:var(--good);background:rgba(95,227,161,.12)}
.recall input.wrong{border-color:var(--bad);background:rgba(255,107,138,.12)}
.hintline{font:500 13px var(--f-mono);letter-spacing:.04em;color:var(--warn);white-space:pre-wrap}
.verdict.mid{color:var(--warn)}
#dzSide{padding:16px 18px 18px;display:flex;flex-direction:column;gap:14px}
#dzSide dl{margin:0;display:grid;gap:12px}
#dzSide dt{font:500 10px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3);margin-bottom:5px}
#dzSide dd{margin:0;font-size:13.5px;color:var(--fg);line-height:1.5}
.dzsteps{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.dzsteps button{background:rgba(158,168,255,.06);border:1px solid var(--line);border-radius:10px;padding:8px 4px;font-size:12px;font-weight:500;color:var(--fg-2);line-height:1.25}
.dzsteps button b{display:block;font:500 10px var(--f-mono);letter-spacing:.1em;color:var(--fg-3);margin-bottom:2px}

/* ============ binary mesh pack ============

function unshuffle(bytes,off,count,Type){
  const sz=Type.BYTES_PER_ELEMENT,out=new Uint8Array(count*sz);
  for(let p=0;p<sz;p++){const base=off+p*count;for(let i=0;i<count;i++)out[i*sz+p]=bytes[base+i];}
  return new Type(out.buffer);
}
async function fetchPack(url,onProgress){
  const resp=await fetch(url);
  if(!resp.ok)throw new Error('Could not load '+url+' ('+resp.status+')');
  const total=+resp.headers.get('content-length')||0;
  let buf;
  if(resp.body&&resp.body.getReader&&total){
    const rd=resp.body.getReader(),chunks=[];let got=0;
    for(;;){const r=await rd.read();if(r.done)break;chunks.push(r.value);got+=r.value.length;onProgress&&onProgress(got/total);}
    buf=new Uint8Array(got);let o=0;for(const c of chunks){buf.set(c,o);o+=c.length;}
  }else buf=new Uint8Array(await resp.arrayBuffer());
  if(/\.txt$/.test(url)){ // base64 text container (the host only serves text-like data files)
    const bin=atob(new TextDecoder('ascii').decode(buf)),n=bin.length;buf=new Uint8Array(n);
    for(let i=0;i<n;i++)buf[i]=bin.charCodeAt(i);

  const hl=new DataView(buf.buffer,buf.byteOffset,4).getUint32(0,true);
  const header=JSON.parse(new TextDecoder().decode(buf.subarray(4,4+hl)));
  const base=4+hl;
  const faces={};
  for(const k in header.faces){const f=header.faces[k];faces[k]=unshuffle(buf,base+f.off,f.nf*3,Uint32Array);}
  const meshes={};
  for(const m of header.meshes){
    const q=unshuffle(buf,base+m.pos,m.n*3,Int16Array),pos=new Float32Array(m.n*3);
    for(let i=0;i<pos.length;i++)pos[i]=q[i]*header.scale;

    if(m.attrs)for(const k in m.attrs)o.attrs[k]=buf.slice(base+m.attrs[k],base+m.attrs[k]+m.n);

  }
  let volume=null;
  if(header.vol){const v=header.vol;volume={dims:v.dims,m:v.m,data:buf.slice(base+v.off,base+v.off+v.len)};}
  return {header,meshes,volume};
}
function toGeo(m){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(m.pos,3));
  g.setIndex(new THREE.BufferAttribute(m.idx,1));
  g.computeVertexNormals();g.computeBoundingBox();g.computeBoundingSphere();
  return g;
}

const MORE={
  'fam:cortex':{link:'Input arrives mostly from the thalamus into layer 4. Layers 2 and 3 talk to other cortical areas, layer 5 projects down to the striatum, brainstem and spinal cord, and layer 6 sends feedback to the thalamus.',spot:'On a T1 scan it is the darker gray ribbon that follows every fold, with brighter white matter underneath.',hook:'A sheet of paper crumpled to fit in a box. Smoothed out, each hemisphere would be about the size of a large pizza.'},
  'fam:wm':{link:'Three families of fibers: association (within one hemisphere, such as the arcuate fasciculus), commissural (across the midline, such as the corpus callosum) and projection (to and from lower centers, such as the internal capsule).',spot:'The brightest tissue on a T1 scan, filling the core of every gyrus.',hook:'The cabling of a city. Cortex is the buildings; white matter is the network that lets districts talk.'},
  'fam:cc':{link:'The front (genu) joins the two prefrontal cortices, the body joins the motor and sensory strips, and the back (splenium) joins the occipital and temporal lobes.',spot:'Midsagittal slice: the bright C-shaped arch above the lateral ventricles, thick at both ends and thinner in the middle.',hook:'A bridge between two cities. Cut it and each side keeps working, but they stop sharing news.'},
  'fam:ac':{link:'Links the temporal poles, amygdalae and olfactory regions of the two sides.',spot:'Midsagittal slice: a small bright dot just in front of the fornix, below the front end of the corpus callosum.',hook:'A side road that still crosses the river, far from the main bridge.'},
  'fam:claustrum':{link:'Two-way connections with nearly all of the cortex, strongest with prefrontal and cingulate areas.',spot:'A hair-thin gray line between the putamen and the insula on axial or coronal slices. Easy to miss.',hook:'Crick and Koch compared it to an orchestra conductor keeping separate players in time.'},
  'fam:hyp':{link:'Controls the pituitary directly below it. Receives from the amygdala, the hippocampus (through the fornix) and the retina, and sends to autonomic centers in the brainstem.',spot:'Midsagittal slice: the small region below the thalamus and behind the optic chiasm, ending at the mammillary bodies.',hook:'The thermostat and control room of the body, about the size of an almond.'},
  'fam:pineal':{link:'Light information travels from the retina to the suprachiasmatic nucleus, down to the superior cervical ganglion and back up to the pineal.',spot:'Midsagittal slice: a small nub behind the thalamus, above the superior colliculi and under the splenium.',hook:'A dimmer switch for night. Darkness turns melatonin up.'},
  'fam:optic_tract':{link:'From the chiasm to the lateral geniculate nucleus, with branches to the superior colliculus and the pretectum (pupil reflex).',spot:'Follow the chiasm backward: a bright band curving around the cerebral peduncle.',hook:'After the crossing, each tract carries one half of the visual world, not one eye.'},
  'fam:stn':{link:'Excited by the cortex (hyperdirect pathway) and inhibited by the external globus pallidus. It excites the internal globus pallidus and the substantia nigra pars reticulata.',spot:'Coronal slice: a small lens above the substantia nigra and below the thalamus, medial to the internal capsule.',hook:'The brake pedal of the basal ganglia. Pressing it stops an action that was about to start.'},
  'fam:fornix':{link:'Hippocampus (fimbria), then crus, body and columns, ending in the mammillary bodies. From there the Papez circuit continues to the anterior thalamus and cingulate gyrus.',spot:'Midsagittal slice: a thin bright arch under the corpus callosum, hanging from it by the septum pellucidum.',hook:'The outgoing mail route of the hippocampus.'},
  'fam:olf':{link:'Receptor neurons in the nose, then bulb, tract, and on to the piriform cortex, amygdala and entorhinal cortex.',spot:'Coronal slice through the frontal lobes: two small dots in the olfactory sulci, under the gyrus rectus.',hook:'Smell has a short line to emotion and memory areas, which is one reason a scent can bring a memory back so sharply.'},
  'fam:mbteg':{link:'Contains the periaqueductal gray, the nuclei of cranial nerves III and IV, the ventral tegmental area and the upper reticular formation.',spot:'Axial slice of the midbrain: the tissue between the aqueduct at the back and the substantia nigra in front.',hook:'The busy middle floor of the brainstem, where wakefulness, eye movement and pain control share a corridor.'},
  'fam:sc':{link:'Input from the retina and visual cortex. Output to brainstem gaze centers, the pulvinar and the neck (tectospinal tract).',spot:'Midsagittal slice: the upper bump on the back of the midbrain, just below the pineal gland.',hook:'The look-over-there reflex. A flash at the edge of vision pulls your gaze before you decide to look.'},
  'fam:ic':{link:'Receives from the cochlear nuclei and superior olive through the lateral lemniscus, and sends to the medial geniculate nucleus.',spot:'Midsagittal slice: the lower bump on the back of the midbrain, under the superior colliculus.',hook:'Superior for sight, inferior for sound. Eyes sit above ears.'},
  'fam:ped':{link:'The middle part carries corticospinal and corticobulbar fibers. The inner and outer parts carry fibers from the cortex to the pons.',spot:'Axial slice of the midbrain: the two front ears of the Mickey Mouse shape.',hook:'The motorway that carries cortical commands down to the brainstem and spinal cord.'},
  'fam:rn':{link:'Input from the cerebellum (interposed and dentate nuclei) and the motor cortex. Output to the inferior olive and, in a small tract, to the spinal cord.',spot:'Axial slice of the midbrain: a round nucleus behind the substantia nigra. Dark on T2 images because of its iron.',hook:'A relay on the return loop of the cerebellum.'},
  'fam:sn':{link:'Pars compacta sends dopamine to the caudate and putamen (nigrostriatal pathway). Pars reticulata sends inhibitory output to the thalamus and superior colliculus.',spot:'Axial slice of the midbrain: the dark band just behind each cerebral peduncle.',hook:'The dopamine tap for movement. In Parkinson disease the tap slowly runs dry.'},
  'fam:pons_b':{link:'Cortex to the pontine nuclei, then across the midline through the middle cerebellar peduncle to the opposite cerebellar hemisphere.',spot:'Midsagittal slice: the big rounded belly on the front of the brainstem.',hook:'Pons is Latin for bridge. It bridges the cerebrum and the cerebellum.'},
  'fam:pons_t':{link:'Holds the nuclei of cranial nerves V, VI, VII and VIII, the locus coeruleus (noradrenaline) and the center for horizontal eye movements.',spot:'Midsagittal slice: the thinner strip of pons behind the belly, forming the floor of the fourth ventricle.',hook:'The face-and-ears switchboard of the brainstem.'},
  'fam:mcp':{link:'Fibers from the opposite pontine nuclei entering the cerebellar hemisphere as mossy fibers.',spot:'Axial slice through the pons: the thick arms joining the pons to the cerebellum on each side.',hook:'The widest on-ramp into the cerebellum, carrying a copy of what the cortex is planning.'},
  'fam:scp':{link:'From the dentate and interposed nuclei, crossing in the midbrain, to the red nucleus and the ventrolateral thalamus, and from there to motor cortex.',spot:'Axial slice at the upper pons: thin bands forming the side walls of the fourth ventricle.',hook:'The exit road of the cerebellum.'},
  'fam:icp':{link:'Brings fibers from the spinal cord, inferior olive and vestibular nuclei into the cerebellum, with a small return path to the vestibular nuclei.',spot:'Axial slice of the upper medulla: the bulge at the back outer corner.',hook:'The service entrance that delivers body-position reports from the spinal cord.'},
  'fam:pyr':{link:'Motor cortex, internal capsule, cerebral peduncle, pons, pyramid, then the crossing into the lateral corticospinal tract.',spot:'Axial slice of the medulla: two rounded columns at the very front, one on each side of the midline.',hook:'Where the wires cross. It is why the left hemisphere moves the right hand.'},
  'fam:medteg':{link:'The nucleus of the solitary tract takes in taste and body signals. The nucleus ambiguus and dorsal vagal nucleus send commands out. Respiratory rhythm generators sit alongside.',spot:'Midsagittal slice: the tapered lowest part of the brainstem, between the pons and the spinal cord.',hook:'Life support. It keeps breathing and heartbeat running without being asked.'},
  'fam:olive':{link:'Input from the red nucleus, spinal cord and cortex. Its output crosses to the opposite cerebellum through the inferior cerebellar peduncle as climbing fibers.',spot:'Axial slice of the medulla: a wrinkled, bag-like nucleus just behind each pyramid.',hook:'The error teacher of the cerebellum. Its signal says that movement was off, adjust.'},
  'fam:dentate':{link:'Purkinje cells inhibit them, and they project out through the superior cerebellar peduncle to the thalamus and red nucleus.',spot:'Axial slice through the cerebellum: the dentate is a wavy line in the white matter of each hemisphere.',hook:'From lateral to medial, dentate, emboliform, globose, fastigial: Don’t Eat Greasy Food.'},
  'fam:aq':{link:'Third ventricle above, fourth ventricle below, surrounded by the periaqueductal gray.',spot:'Midsagittal slice: a thin dark line through the back of the midbrain, in front of the colliculi.',hook:'The narrowest pipe in the plumbing, so a blockage here causes the most trouble.'},
  'fam:thal':{link:'Each nucleus pairs with a cortical territory: LGN with visual cortex, MGN with auditory cortex, VPL and VPM with somatosensory cortex, VL with motor cortex, mediodorsal with prefrontal cortex, anterior with cingulate cortex.',spot:'Axial slice: the two gray eggs on either side of the third ventricle, medial to the internal capsule.',hook:'A reception desk more than a relay. It decides which signals get passed up to the cortex.'},
  'fam:optic':{link:'Optic nerves in, optic tracts out. It sits just above the pituitary gland.',spot:'Midsagittal slice: a small bright block in front of the hypothalamus, above the pituitary.',hook:'An X-shaped junction where the inner lanes swap sides.'},
  'fam:caud':{link:'Input from prefrontal and association cortex, and dopamine from the substantia nigra. Output to the globus pallidus and substantia nigra.',spot:'Axial slice: the head bulges into the front horn of the lateral ventricle. The internal capsule separates it from the putamen.',hook:'Shaped like a tadpole: a big head at the front and a tail curling back and down into the temporal lobe.'},
  'fam:put':{link:'Input from motor and somatosensory cortex, and dopamine from the substantia nigra. Output to both segments of the globus pallidus.',spot:'Axial slice: the outer part of the lens-shaped nucleus, just inside the claustrum and insula.',hook:'The habit library. Well-practised movements are kept here so you do not have to think about them.'},
  'fam:gp':{link:'Input from the striatum and the subthalamic nucleus. The internal segment sends inhibitory output to the motor thalamus.',spot:'Axial slice: the paler inner part of the lens, between the putamen and the internal capsule.',hook:'A handbrake that is on by default. The striatum releases it to let a movement through.'},
  'fam:acc':{link:'Dopamine from the ventral tegmental area. Input from prefrontal cortex, amygdala and hippocampus. Output to the ventral pallidum.',spot:'Coronal slice at the front of the striatum: the gray bridge under the caudate head, where it meets the putamen.',hook:'The I-want-that signal. It is more about wanting than about liking.'},
  'fam:hippo':{link:'Entorhinal cortex in (perforant path), then dentate gyrus, CA3, CA1 and subiculum, and out through the fornix and back to entorhinal cortex.',spot:'Coronal slice: a rolled-up spiral of gray matter in the floor of the temporal horn of the lateral ventricle.',hook:'The save button. Old files stay readable without it, but nothing new gets stored.'},
  'fam:amyg':{link:'Sensory input reaches the lateral nucleus. The central nucleus drives the hypothalamus and brainstem (heart rate, freezing). The basal nuclei talk to prefrontal cortex and the hippocampus.',spot:'Coronal slice: a gray mass in the front of the medial temporal lobe, just ahead of the hippocampus and the tip of the temporal horn.',hook:'A smoke alarm. Fast, sensitive, and sometimes wrong.'},
  'fam:cb':{link:'Input arrives as mossy fibers (from the pons and spinal cord) and climbing fibers (from the inferior olive). Purkinje cells are the only output of its cortex, and they inhibit the deep nuclei.',spot:'Under the occipital lobes and behind the brainstem. Its fine parallel folds look like leaves in a midsagittal slice.',hook:'Autocorrect for movement. It compares what you meant to do with what is happening and fixes the difference.'},
  'fam:cbw':{link:'Carries mossy and climbing fibers in, and Purkinje cell axons to the deep nuclei.',spot:'Midsagittal slice through the vermis: a bright branching tree.',hook:'Arbor vitae means tree of life. Find the tree and you have found the cerebellum.'},
  'fam:lv':{link:'Each one drains through an interventricular foramen (of Monro) into the third ventricle.',spot:'Dark on T1. Axial slice: a butterfly shape in the middle of the brain. Coronal slice: two slits under the corpus callosum.',hook:'A pair of C-shaped water tanks, one per hemisphere.'},
  'fam:v3':{link:'Fed by both lateral ventricles through the foramina of Monro. Drains into the cerebral aqueduct.',spot:'Coronal slice: a thin dark vertical slit on the midline, between the two thalami.',hook:'The narrow hallway between two rooms, the thalami.'},
  'fam:mam':{link:'In: the fornix, carrying hippocampal output. Out: the mammillothalamic tract to the anterior nucleus of the thalamus, which projects to the cingulate gyrus and back toward the hippocampus.',spot:'On the underside of the brain, two pea-sized knobs between the cerebral peduncles. In a midsagittal slice, a small round bump at the back of the hypothalamus, below the fornix column that ends in it.',hook:'The name comes from the Latin mammilla, little breast, for their shape. Think of them as the post office where the fornix hands memory mail to the thalamus.'},
  'fam:chp':{link:'Fed by the anterior and posterior choroidal arteries. It is continuous through the interventricular foramen with the plexus in the roof of the third ventricle; the fourth ventricle has its own in its roof.',spot:'Inside the dark fluid of the lateral ventricle on a T1 scan, look for small grey tufts, largest in the atrium. After contrast it lights up brightly because its capillaries are leaky.',hook:'A tap that never turns off. It drips fluid into the ventricles all day, and the drains further down have to keep up.'},
  'fam:v4':{link:'Fed by the aqueduct. Empties through one median opening (Magendie) and two lateral openings (Luschka) into the subarachnoid space.',spot:'Midsagittal slice: a dark tent-shaped space between the pons and the cerebellum.',hook:'A tent pitched on the back of the brainstem, with the cerebellum as its roof.'},
  'lobe:frontal':{link:'Linked to the parietal and temporal lobes by the superior longitudinal and arcuate fasciculi, and to the basal ganglia and thalamus in loops.',spot:'Find the central sulcus first. Everything in front of it is frontal, about a third of each hemisphere.',hook:'The manager. It sets goals, holds the plan in mind and stops what should not happen.'},
  'lobe:parietal':{link:'Receives touch from the thalamus and vision along the dorsal stream, and is linked to frontal cortex by the superior longitudinal fasciculus.',spot:'Between the central sulcus in front and the parieto-occipital sulcus behind, which is clearest on the medial surface.',hook:'The map room: where your body is and where things around it are.'},
  'lobe:temporal':{link:'The ventral visual stream ends here. The arcuate fasciculus links it to frontal language areas, and the uncinate fasciculus links its pole to orbitofrontal cortex.',spot:'The thumb of the boxing-glove shape, below the lateral fissure.',hook:'The library: sounds, words, faces and memories filed for recognition.'},
  'lobe:occipital':{link:'Input from the lateral geniculate nucleus through the optic radiations. Output along the dorsal (where) and ventral (what) streams.',spot:'The back pole. On the medial surface it lies behind the parieto-occipital sulcus.',hook:'The projection screen at the back of the cinema.'},
  'lobe:insular':{link:'Connected with the amygdala, anterior cingulate, orbitofrontal cortex and the thalamic nuclei for taste and body signals.',spot:'Coronal or axial slice: the cortex hidden deep in the lateral fissure, just outside the claustrum and putamen.',hook:'The dashboard that reads out the state of the body: heartbeat, hunger, pain, disgust.'},
  'lobe:limbic':{link:'The cingulum bundle runs inside it, linking frontal cortex, the posterior cingulate and the hippocampal region.',spot:'Midsagittal slice: the gyrus that wraps around the corpus callosum like a collar.',hook:'Cingulate means belt. It is the belt around the corpus callosum.'}

function readLinks(q){
  const e=encodeURIComponent;

function ramp(stops,t,out){

}
function initTables(h){

/* cortex vertex colours. mode: natural | lobes | gyri | ba | hier | ap | lat | lobe:i | dk:i | ds:i,j | ba:n */
function paintCortex(geo,mode){
  const u=geo.userData,N=u.n,col=geo.attributes.color.array,pos=geo.attributes.position.array,A=u.attrs,c=new THREE.Color();
  let sel=null,kind=mode;
  const ci=mode.indexOf(':');
  if(ci>0){kind=mode.slice(0,ci);sel=mode.slice(ci+1).split(',').map(Number);}
  for(let i=0;i<N;i++){
    const sulc=A.sulc[i]/255*4-2,depth=sstep(-0.5,1.05,sulc);
    const cv=A.curv?clamp((A.curv[i]-128)/64,-1,1):0;
    const dk=A.dk[i],isCtx=A.ctx[i]===1&&dk>0;
    /* sulcal depth darkens the folds and curvature sharpens their edges, so every sulcus reads as a line */
    let shade=clamp(1.06-0.74*depth-0.17*cv,0.18,1.12);
    if(!isCtx){c.copy(COL_MW);shade=0.9;}
    else{
      const lobe=LOBE_OF_DK[dk];
      if(kind==='natural')c.copy(COL_NAT).lerp(COL_FUNDUS,0.7*depth);
      else if(kind==='dz'){const w=(DZ.side&&u.side!==DZ.side)?0:(DZ.w?DZ.w[dk]||0:0);c.copy(COL_NAT).lerp(COL_FUNDUS,0.7*depth).lerp(DZ_COL,0.9*w);if(w>0.05)shade=0.55+0.45*shade;}
      else if(kind==='sulci'){
        const d=A.ds[i],li=LAND_OF_DS[d];
        if(li>=0){c.copy(LAND_RGB[li]);shade=0.78+0.22*shade;}
        else if(IS_SULC[d]){c.copy(COL_SULC);shade=0.6+0.4*shade;}
        else{c.copy(COL_CROWN);shade=0.66+0.34*shade;}
      }
      else if(kind==='lobes')c.copy(lobe>=0?LOBE_RGB[lobe]:COL_NAT).lerp(COL_NAT,0.15);
      else if(kind==='gyri')c.copy(DK_PAL[dk]).lerp(COL_NAT,0.12);
      else if(kind==='ba'){const b=A.ba[i];if(b>0)c.copy(BA_PAL[b]);else c.copy(COL_NAT).multiplyScalar(0.75);}
      else if(kind==='hier')ramp(HIER_STOPS,HIER_OF_DK[dk],c);
      else if(kind==='ap')c.copy(AP_A).lerp(AP_B,clamp((pos[i*3+2]+9)/18,0,1));
      else if(kind==='lat')c.copy(u.side>0?LAT_L:LAT_R);
      else{
        let on=false;
        if(kind==='lobe')on=lobe===sel[0];
        else if(kind==='dk')on=dk===sel[0];
        else if(kind==='ba')on=A.ba[i]===sel[0];
        if(kind==='ds'){on=sel.indexOf(A.ds[i])>=0;if(on){const li=LAND_OF_DS[A.ds[i]];if(li>=0)c.copy(LAND_RGB[li]);else c.set('#ffd27a');}}
        else if(on){if(kind==='lobe')c.copy(LOBE_RGB[sel[0]]);else if(kind==='dk')c.copy(DK_PAL[dk]).lerp(new THREE.Color('#ffffff'),0.25);else c.set('#ffd27a');}
        if(!on){if(kind==='ds'){c.copy(COL_NAT).lerp(COL_FUNDUS,0.7*depth).multiplyScalar(0.82);}else{c.setRGB(0.42,0.40,0.46);shade=0.6+0.4*shade;}}

      }
    }
    const jit=1+0.03*Math.sin(pos[i*3]*9.3+pos[i*3+1]*7.1+pos[i*3+2]*5.7);
    col[i*3]=c.r*shade*jit;col[i*3+1]=c.g*shade*jit;col[i*3+2]=c.b*shade*jit;

}
/* nearest cortical vertex to a point in the geometry's local space */
function nearestVertex(geo,p){
  const a=geo.attributes.position.array;let best=1e9,bi=0;
  for(let i=0;i<a.length;i+=3){const d=sq(a[i]-p.x)+sq(a[i+1]-p.y)+sq(a[i+2]-p.z);if(d<best){best=d;bi=i/3;}}
  return bi;
}
function cortexLabels(geo,vi){
  const A=geo.userData.attrs,dk=A.dk[vi],ds=A.ds[vi],ba=A.ba[vi],ctx=A.ctx[vi]===1&&dk>0;
  return{vi,dk,ds,ba,ctx,lobe:ctx?LOBE_OF_DK[dk]:-1};
}

/* Spread the explode offsets so structures do not interpenetrate when fully exploded.
   Starts from each family's hand-set direction, then pushes overlapping bounding spheres apart,
   keeping left/right pairs mirror-symmetric. Hemispheres and their white matter stay fixed. */
function relaxExplode(parts){
  const fixed=new Set(['cortex','wm']),mov=parts.filter(p=>!fixed.has(p.fam));
  const O=V3(0,-1.5,-0.5);
  for(const p of mov){
    if(!FAM[p.fam].ex||FAM[p.fam].ex.length!==3){const d=p.center.clone().sub(O);p.ex=d.multiplyScalar(1.5);}
    const bb=p.geo.boundingBox,dg=bb.max.clone().sub(bb.min).length();
    p.rad=clamp(dg*0.46,0.9,3.8);
  }
  const pos=new Map(mov.map(p=>[p,p.center.clone().add(p.ex)]));
  const mate=new Map();
  for(const p of mov)if(p.side==='L')mate.set(p,mov.find(q=>q.fam===p.fam&&q.side==='R'));
  const hemis=parts.filter(p=>p.fam==='cortex').map(p=>({c:p.center.clone().add(p.ex),r:6.2}));
  for(let it=0;it<90;it++){
    const disp=new Map(mov.map(p=>[p,V3(0,0,0)]));
    for(let i=0;i<mov.length;i++)for(let j=i+1;j<mov.length;j++){
      const a=mov[i],b=mov[j],d=pos.get(a).clone().sub(pos.get(b)),dist=d.length(),min=a.rad+b.rad+1.1;
      if(dist<min){
        if(dist<1e-4)d.set(Math.sin(i*12.9),Math.cos(j*7.3),Math.sin(i+j)).normalize();else d.divideScalar(dist);
        const push=(min-dist)*0.5;disp.get(a).addScaledVector(d,push);disp.get(b).addScaledVector(d,-push);
      }
    }
    for(const a of mov)for(const h of hemis){
      const d=pos.get(a).clone().sub(h.c),dist=d.length(),min=a.rad+h.r;
      if(dist<min){d.divideScalar(Math.max(dist,1e-4));disp.get(a).addScaledVector(d,(min-dist)*0.8);}
    }
    for(const [L,R] of mate){
      if(!R)continue;
      const dl=disp.get(L),dr=disp.get(R),m=V3((dl.x-dr.x)/2,(dl.y+dr.y)/2,(dl.z+dr.z)/2);
      disp.get(L).copy(m);disp.get(R).set(-m.x,m.y,m.z);
    }
    for(const a of mov)pos.get(a).addScaledVector(disp.get(a),0.7);
  }
  for(const p of mov)p.ex=pos.get(p).clone().sub(p.center);
}

  const a=new THREE.Vector3(...from),b=new THREE.Vector3(...to),dir=b.clone().sub(a),len=dir.length();dir.normalize();
  const rad=opt.r||0.17,head=opt.head||1.5,g=new THREE.Group();
  const q=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0),dir);
  const mk=(scale,op)=>{
    const grp=new THREE.Group();
    const shaftLen=len-head*(opt.double?2:1);
    const shaft=new THREE.Mesh(new THREE.CylinderGeometry(rad*scale,rad*scale,shaftLen,16),glowMat(color,op,opt.depth));
    shaft.position.copy(a).addScaledVector(dir,(opt.double?head:0)+shaftLen/2);shaft.quaternion.copy(q);
    const cone=new THREE.Mesh(new THREE.ConeGeometry(rad*2.6*scale,head,20),glowMat(color,op,opt.depth));
    cone.position.copy(b).addScaledVector(dir,-head/2);cone.quaternion.copy(q);
    grp.add(shaft,cone);
    if(opt.double){const c2=new THREE.Mesh(new THREE.ConeGeometry(rad*2.6*scale,head,20),glowMat(color,op,opt.depth));c2.position.copy(a).addScaledVector(dir,head/2);c2.quaternion.copy(q).multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0),Math.PI));grp.add(c2);}
    return grp;
  };
  g.add(mk(1,0.96),mk(2.4,0.16));
  if(opt.tail){const s=new THREE.Mesh(new THREE.SphereGeometry(rad*2.2,16,12),glowMat(color,0.96,opt.depth));s.position.copy(a);g.add(s);}
  g.traverse(o=>{if(o.isMesh)o.renderOrder=5000;});
  overlay.add(g);return g;
}
function addPlaneFrame(axis,pos,color){
  const g=new THREE.Group();
  const size={x:[22,17],y:[17,22],z:[17,17]}[axis];
  const m=new THREE.Mesh(new THREE.PlaneGeometry(size[0],size[1]),new THREE.MeshBasicMaterial({color,transparent:true,opacity:0.2,side:THREE.DoubleSide,depthWrite:false,depthTest:false}));

function addTube(points,color,rad,opt){
  opt=opt||{};

  const g=new THREE.Group();
  g.add(new THREE.Mesh(new THREE.TubeGeometry(curve,80,rad,10,false),glowMat(color,0.98,opt.depth)));
  g.add(new THREE.Mesh(new THREE.TubeGeometry(curve,80,rad*2.4,10,false),glowMat(color,0.16,opt.depth)));
  if(opt.arrow){
    const e=curve.getPoint(1),t=curve.getTangent(1);
    const cone=new THREE.Mesh(new THREE.ConeGeometry(rad*3,rad*7,16),glowMat(color,0.98,opt.depth));
    cone.position.copy(e).addScaledVector(t,rad*2.5);cone.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),t);g.add(cone);

  overlay.add(g);return g;
}

const curPaint={cortex:null,hippo:null};
function paintHippo(on){
  for(const p of parts){
    if(p.fam!=='hippo')continue;
    const g=p.geo,pos=g.attributes.position.array,col=g.attributes.color.array,n=pos.length/3,base=new THREE.Color(FAM.hippo.color),c=new THREE.Color();
    if(!g.userData.t){ // long-axis coordinate from the principal axis, 0 = anterior head, 1 = posterior tail
      let mx=0,my=0,mz=0;for(let i=0;i<n;i++){mx+=pos[i*3];my+=pos[i*3+1];mz+=pos[i*3+2];}mx/=n;my/=n;mz/=n;
      let cxx=0,cxy=0,cxz=0,cyy=0,cyz=0,czz=0;
      for(let i=0;i<n;i++){const x=pos[i*3]-mx,y=pos[i*3+1]-my,z=pos[i*3+2]-mz;cxx+=x*x;cxy+=x*y;cxz+=x*z;cyy+=y*y;cyz+=y*z;czz+=z*z;}
      let v=[0.2,0.3,1];for(let k=0;k<40;k++){const a=cxx*v[0]+cxy*v[1]+cxz*v[2],b=cxy*v[0]+cyy*v[1]+cyz*v[2],d=cxz*v[0]+cyz*v[1]+czz*v[2],l=Math.hypot(a,b,d);v=[a/l,b/l,d/l];}
      if(v[2]<0)v=[-v[0],-v[1],-v[2]];
      const t=new Float32Array(n);let lo=1e9,hi=-1e9;
      for(let i=0;i<n;i++){t[i]=(pos[i*3]-mx)*v[0]+(pos[i*3+1]-my)*v[1]+(pos[i*3+2]-mz)*v[2];lo=Math.min(lo,t[i]);hi=Math.max(hi,t[i]);}
      for(let i=0;i<n;i++)t[i]=1-(t[i]-lo)/(hi-lo);
      g.userData.t=t;
    }
    const t=g.userData.t;
    for(let i=0;i<n;i++){if(on)c.copy(AP_B).lerp(AP_A,t[i]);else c.copy(base);col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;}
    g.attributes.color.needsUpdate=true;
  }
}

let curUnfold=0,unfoldRaf=0;
function applyUnfold(){
  unfoldRaf=0;
  const t=clamp(S.unfold||0,0,1)*0.86;if(t===curUnfold)return;curUnfold=t;
  for(const p of parts){
    if(p.fam!=='cortex'||!p.white)continue;
    const pos=p.geo.attributes.position.array,a=p.pial,b=p.white;
    for(let i=0;i<pos.length;i++)pos[i]=a[i]+(b[i]-a[i])*t;
    p.geo.attributes.position.needsUpdate=true;p.geo.computeVertexNormals();p.geo.computeBoundingSphere();

const regionCache={};
function regionInfo(dkName,side){
  const key=dkName+side;if(regionCache[key])return regionCache[key];
  const part=partOf('cortex'+side),idx=NAMES.dk.indexOf(dkName),A=part.mesh.attrs,pos=part.geo.attributes.position.array,nrm=part.geo.attributes.normal.array;
  let sx=0,sy=0,sz=0,n=0;const verts=[];
  for(let i=0;i<A.dk.length;i++)if(A.dk[i]===idx&&A.ctx[i]){sx+=pos[i*3];sy+=pos[i*3+1];sz+=pos[i*3+2];n++;verts.push(i);}
  sx/=n;sy/=n;sz/=n;
  let bi=0,bd=1e9;
  for(let i=0;i<A.dk.length;i++)if(A.dk[i]===idx&&A.ctx[i]){const d=sq(pos[i*3]-sx)+sq(pos[i*3+1]-sy)+sq(pos[i*3+2]-sz);if(d<bd){bd=d;bi=i;}}
  const r={idx,n,verts,centroid:V3(sx,sy,sz),vertex:V3(pos[bi*3],pos[bi*3+1],pos[bi*3+2]),normal:V3(nrm[bi*3],nrm[bi*3+1],nrm[bi*3+2])};
  return (regionCache[key]=r);
}
/* a point on the outer (lateral) crown of a region, lifted outward along x */
function lateralPt(name,side,lift){
  const r=regionInfo(name,side),pos=partOf('cortex'+side).geo.attributes.position.array,sg=side==='L'?1:-1;
  const near=r.verts.map(i=>[sq(pos[i*3+1]-r.centroid.y)+sq(pos[i*3+2]-r.centroid.z),i]).sort((a,b)=>a[0]-b[0]).slice(0,80);
  let best=near[0][1],bx=-1e9;for(const [,i] of near){const v=sg*pos[i*3];if(v>bx){bx=v;best=i;}}
  return V3(pos[best*3]+sg*lift,pos[best*3+1],pos[best*3+2]);
}

const landCache={};

/* The course of a sulcus as a line you can see: its labelled vertices lie deep in the fold, so order them along their long axis

function applyLook(){
  const a=$('#app'),custom=LOOK.bg==='color';
  let light=false;
  if(custom){
    const c=new THREE.Color(LOOK.col),hi=c.clone().lerp(new THREE.Color('#ffffff'),0.22),lo=c.clone().multiplyScalar(0.74);
    a.style.background='radial-gradient(75% 65% at 50% 42%,'+hi.getStyle()+','+c.getStyle()+' 58%,'+lo.getStyle()+')';
    light=(0.2126*c.r+0.7152*c.g+0.0722*c.b)>0.4;
    delete a.dataset.bg;
  }else{a.style.background='';if(LOOK.bg==='midnight')delete a.dataset.bg;else a.dataset.bg=LOOK.bg;}
  if(light)a.dataset.light='1';else delete a.dataset.light;
  /* on a light backdrop glowing neurons would vanish, so they are drawn as dark ink instead */
  const m={off:0,faint:1,bright:2.6}[LOOK.nr];const st=helpers.userData.stars;
  st.visible=m>0;
  st.children.forEach(c=>{const M=c.material,u=M.userData;
    if(u.col===undefined){u.col=M.color.getHex();u.bl=M.blending;}
    M.blending=light?THREE.NormalBlending:u.bl;M.color.setHex(light?0x4a2f7a:u.col);
    M.opacity=Math.min(1,u.o*(m||1)*(light?1.6:1));M.needsUpdate=true;});
  helpers.userData.floor.visible=!custom&&LOOK.bg!=='black'&&LOOK.bg!=='slate';
  $$('#bgSeg button').forEach(b=>b.classList.toggle('on',!custom&&b.dataset.b===LOOK.bg));

const DS={i:0,stage:0,xrayUser:null,timer:0};
function dzStop(){if(DS.timer){clearInterval(DS.timer);DS.timer=0;}const b=$('#dzPlay');if(b)b.textContent='Play the progression';}
function dzApply(fly){
  const D=DISEASES[DS.i],st=DS.stage?D.stages[DS.stage-1]:null;
  clearOverlay();
  DZ.scale=st?Object.assign({},st.sc):{};
  DZ.side=D.side||0;
  const w=new Float32Array(NAMES.dk.length);let anyCx=false;
  if(st&&st.cx)for(const k in st.cx){const i=NAMES.dk.indexOf(k);if(i>=0){w[i]=st.cx[k];anyCx=true;}}
  DZ.w=w;
  S.cortexSel='dz:'+D.id+DS.stage;curPaint.cortex=null;
  setUnfold(st?st.fold||0:0,true);
  const xr=DS.xrayUser!==null?DS.xrayUser:(st?!!st.xray:false);
  S.xray=xr;$('#dzXray').checked=xr;
  const hl=new Map();
  if(st){
    for(const f in st.sc)if(FAM[f])hl.set(f,st.sc[f]<1?'#ff7a59':'#6db9ff');
    (st.mark||[]).forEach(f=>{if(!hl.has(f))hl.set(f,f==='cortex'?null:'#b48cff');});
    if(anyCx&&!hl.has('cortex'))hl.set('cortex',null);
  }
  S.hl=hl.size?hl:null;
  if(st&&st.cut){S.lastAxis='x';if(S.cut.axis!=='x')A.pos=DISABLED;S.cut={axis:'x',pos:0,flip:false};}
  else if(S.cut.axis){S.cut={axis:null,pos:0,flip:false};}
  applyPaint();
  const cam=(st&&st.cam)||(fly?D.cam:null);
  if(cam)flyTo({az:cam.az*DEG,el:cam.el*DEG,dist:cam.dist,target:HOME.target},1.2);
  else if(fly)flyTo(HOME,1.2);
  dzRender();
}

  $('#dzTag').textContent=D.tag;$('#dzTitle').textContent=D.name;$('#dzLead').textContent=D.lead;
  $('#dzSteps').innerHTML=[{short:'Healthy'}].concat(D.stages).map((x,i)=>'<button type="button" data-s="'+i+'" class="'+(i===DS.stage?'on':'')+'"><b>'+(i?(D.steplab||'Stage'):'Start')+'</b>'+esc(x.short)+'</button>').join('');
  $('#dzPlay').hidden=!!D.steplab;

  if(!st)h='<div><dt>Start here</dt><dd>This is the healthy brain. Step through the '+(D.steplab?'arteries':'stages')+' above to see what changes and what the person would notice.</dd></div>';

      .concat((st.mark||[]).filter(f=>f!=='cortex'&&!(f in st.sc)).map(f=>'<span>'+esc(FAM[f].name)+'</span>'));
    h='<div><dt>'+esc(st.name)+'</dt><dd>'+esc(st.see)+'</dd></div><div><dt>What the person notices</dt><dd>'+esc(st.sym)+'</dd></div>'+
      (parts.length?'<div><dt>'+(D.steplab?'Deep structures supplied':'Structures involved')+'</dt><dd><div class="dzlist">'+parts.join('')+'</div></dd></div>':'');

function shuffle(r,a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function opts(r,correct,pool,n){
  const others=shuffle(r,pool.filter(x=>x!==correct)).slice(0,n-1);

function midlinePoints(){
  const pts=[];
  for(let z=-9;z<=9.01;z+=0.9){
    let best=-1e9;
    for(const id of ['cortexL','cortexR']){
      const a=partOf(id).geo.attributes.position.array;
      for(let i=0;i<a.length;i+=3)if(Math.abs(a[i])<0.45&&Math.abs(a[i+2]-z)<0.25&&a[i+1]>best)best=a[i+1];

    if(best>-1e8)pts.push(V3(0,best+0.12,z));
  }
  return pts;
}

const GENERIC=/\b(gyrus|gyri|sulcus|cortex|lobe|lobule|nucleus|plane|axis|gradient|fissure)\b/g;
function normAns(t){
  return String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/grey/g,'gray').replace(/['’]s\b/g,'s').replace(/[^a-z0-9 ]/g,' ').replace(/\b(the|of|and|a|an)\b/g,' ').replace(/\s+/g,' ').trim();
}
function answerForms(q,o){
  const out=new Set([o.label]),m=/^(.*?)\s*\((.*)\)\s*$/.exec(o.label);
  if(m){out.add(m[1]);m[2].split(/,| or /).forEach(x=>out.add(x));}
  o.label.split(',').forEach((x,i)=>{if(i===0)out.add(x);});
  (ALIAS[NS[q.kind]+':'+o.id]||[]).forEach(x=>out.add(x));
  return Array.from(out).map(normAns).filter(Boolean);
}
function lev(a,b){
  const m=a.length,n=b.length;if(!m)return n;if(!n)return m;
  let prev=[];for(let j=0;j<=n;j++)prev[j]=j;
  for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur;}
  return prev[n];
}
function closeTo(t,v){if(t===v)return 2;const tol=v.length<5?0:v.length<8?1:2;return lev(t,v)<=tol?1:0;}
function scoreForms(t,forms){
  let best=0;const bare=!GENERIC.test(t);GENERIC.lastIndex=0;
  for(const v of forms){
    best=Math.max(best,closeTo(t,v));
    if(bare){const sv=v.replace(GENERIC,' ').replace(/\s+/g,' ').trim();GENERIC.lastIndex=0;if(sv&&sv!==v)best=Math.max(best,closeTo(t,sv));}
  }
  return best;
}
function matchTyped(q,text){
  const t=normAns(text),ans=q.options.find(o=>o.id===q.answer);
  const sc=scoreForms(t,answerForms(q,ans));
  if(sc)return{ok:true,exact:sc===2,label:ans.label};
  for(const o of q.options){if(o.id===q.answer)continue;if(scoreForms(t,answerForms(q,o)))return{ok:false,other:o.label,label:ans.label};}
  return{ok:false,label:ans.label};
}
function hintFor(q,level){
  const lab=q.options.find(o=>o.id===q.answer).label.replace(/\s*\(.*\)\s*$/,'');
  return lab.split(' ').map(w=>w.split('').map((ch,i)=>/[a-z0-9]/i.test(ch)?(i<level?ch:'_'):ch).join(' ')).join('    ');
}

    const sizes={x:bb.max.x-bb.min.x,y:bb.max.y-bb.min.y,z:bb.max.z-bb.min.z};
    let axes=['x','y','z'].filter(a=>sizes[a]>0.9);if(!axes.length)axes=['z'];

    const sided=fam2parts(f)[0].side!=='M';
    const pos=axis==='x'?(sided?c.x:0):axis==='y'?c.y:c.z;
    const flip=axis==='y';
    const face={x:{az:-90,el:0},z:{az:180,el:0},y:{az:0,el:86}}[axis];
    const g=FAM[f].group,same=keys.filter(k=>FAM[k].group===g&&k!==f),rest=keys.filter(k=>k!==f&&FAM[k].group!==g);
    const pool=shuffle(r,same).slice(0,2).concat(shuffle(r,rest)).slice(0,3).concat([f]);
    return{tag:'Structures in a slice',prompt:'What is the bright area in this '+PLANES[axis].name.toLowerCase()+' slice?',sub:'Everything else in the cut face is dimmed.',
      options:shuffle(r,pool).map(k=>({id:k,label:FAM[k].name})),answer:f,
      explain:'<b>'+FAM[f].name+'.</b> '+FAM[f].about,
      setup(){quizCut(axis,pos,flip);S.hl=new Map([[f,'#9ca8ff']]);camOn(face.az,face.el,41);}};
  },
  lobe(r){
    const k=pickOne(r,[0,1,2,3,5]);
    const side=pickOne(r,[1,-1]),medial=k===5||(k===3&&r()<0.4);
    return{tag:'Lobes',prompt:'Which lobe is colored in?',sub:medial?'You are looking at the medial surface. The other lobes are gray.':'The other lobes are gray.',
      options:opts(r,k,[0,1,2,3,5],4).map(i=>({id:String(i),label:LOBES[i].name})),answer:String(k),
      explain:'<b>'+LOBES[k].name+'.</b> '+LOBES[k].about,
      setup(){
        S.cortexSel='lobe:'+k;S.hl=new Map([['cortex',null]]);
        if(medial){quizCut('x',0,side<0);camOn(side>0?-90:90,6,44);}
        else camOn(side*90,10,44);
      }};
  },
  gyrus(r){
    const name=pickOne(r,GYRI_Q),idx=NAMES.dk.indexOf(name),side=pickOne(r,[1,-1]);
    const ri=regionInfo(name,side>0?'L':'R'),medial=Math.abs(ri.centroid.x)<3.4;
    const D=DK_INFO[name],lobe=DK_LOBE[name];
    const same=GYRI_Q.filter(n=>DK_LOBE[n]===lobe&&n!==name),rest=GYRI_Q.filter(n=>DK_LOBE[n]!==lobe);
    const pool=shuffle(r,same).slice(0,2).concat(shuffle(r,rest)).slice(0,3).concat([name]);
    return{tag:'Gyri',prompt:'Name the highlighted gyrus.',sub:'Desikan–Killiany parcellation of this brain’s cortical surface.',
      options:shuffle(r,pool).map(n=>({id:n,label:DK_INFO[n].n})),answer:name,
      explain:'<b>'+D.n+'.</b> '+D.about+' '+D.does,
      setup(){

        if(medial){quizCut('x',0,side<0);camOn(side>0?-90:90,6,44);}
        else camOn(side*(ri.centroid.y>3.5?70:88),ri.centroid.y>3.5?42:10,44);
      }};
  },
  land(r){
    const keys=Object.keys(DS_LAND);
    const k=pickOne(r,keys),side=pickOne(r,[1,-1]);
    const v=LAND_VIEW[k];
    return{tag:'Landmarks',prompt:'Which landmark is traced?',sub:'The bright line follows it from end to end. Rotate if you need a better angle.',
      options:opts(r,k,keys,4).map(a=>({id:a,label:DS_LAND[a].name})),answer:k,
      explain:'<b>'+DS_LAND[k].name+'.</b> '+DS_LAND[k].about,
      setup(){
        if(k==='longit'){addTube(midlinePoints(),0xffd27a,0.11,{depth:true});}
        else{S.cortexSel='ds:'+LAND_DS[k].join(',');S.tubes=[[k,side>0?'L':'R']];}
        S.hl=new Map([['cortex',null]]);
        if(v.cut){quizCut('x',0,side<0);camOn(side>0?-90:90,v.el,44);}
        else camOn(side*v.az,v.el,44);
      }};
  },
  func(r){
    const keys=funcKeys();
    const f=pickOne(r,keys),g=FAM[f].group;
    const same=keys.filter(k=>FAM[k].group===g&&k!==f),rest=keys.filter(k=>FAM[k].group!==g);
    const pool=shuffle(r,same).slice(0,2).concat(shuffle(r,rest)).slice(0,3).concat([f]);
    const c=famCenter[f];
    return{tag:'Function',prompt:'Which structure does this?',quote:FAM[f].does,sub:'Nothing is lit. It lights up once you answer.',
      options:shuffle(r,pool).map(k=>({id:k,label:FAM[k].name})),answer:f,
      explain:'<b>'+FAM[f].name+'.</b> '+FAM[f].about,
      setup(){camOn(pickOne(r,[-1,1])*rnd(r,30,55),14,46);},
      reveal(){S.xray=true;S.hl=new Map([[f,'#9ca8ff']]);const big=f==='cb'||f==='wm'||f==='cc';camOn(sph().az/DEG,16,big?44:34,big?HOME.target:V3(c.x*0.4,c.y,c.z));}};
  },
  recallfn(r){
    const keys=Object.keys(FAM).filter(k=>k!=='cortex'&&k!=='wm'&&k!=='cbw'&&parts.some(p=>p.fam===k));
    const f=pickOne(r,keys),c=famCenter[f],F=FAM[f],m=MORE['fam:'+f];
    const what=r()<0.45&&DAMAGE.has(f)?'note':'does';
    return{tag:'Free recall',free:true,prompt:what==='does'?'What does the '+lowerName(F.name)+' do?':'What happens when the '+lowerName(F.name)+' is damaged or goes wrong?',
      sub:'It is glowing in the brain. Answer in your own words before you reveal.',
      options:[{id:f,label:F.name}],answer:f,
      explain:'<b>'+F.name+'.</b> '+(what==='does'?F.does:F.note)+(m?' <b>Think of it as:</b> '+esc(m.hook):''),
      setup(){S.xray=true;S.hl=new Map([[f,'#9ca8ff']]);const big=f==='cb'||f==='cc';camOn(pickOne(r,[-1,1])*rnd(r,40,75),rnd(r,10,30),big?44:34,big?HOME.target:V3(c.x*0.4,c.y,c.z));}};
  },
  org(r){
    const id=pickOne(r,['hier','ap','lat','streams','hippo','radial']);
    const pool=Object.keys(ORG);
    return{tag:'Organization',prompt:'Which axis of organization is shown?',sub:'Colors and arrows are schematic.',
      options:opts(r,id,pool,4).map(k=>({id:k,label:ORG[k].label})),answer:id,
      explain:'<b>'+ORG[id].label+'.</b> '+ORG[id].txt,
      setup(){
        if(id==='hier'){S.mode='hier';camOn(90,12,44);}
        if(id==='ap'){S.mode='ap';camOn(pickOne(r,[90,-90]),10,44);}
        if(id==='lat'){S.mode='lat';camOn(180,78,44);}
        if(id==='streams'){
          const dors=['lateraloccipital','inferiorparietal','supramarginal','caudalmiddlefrontal'].map(n=>lateralPt(n,'L',0.45));
          const vent=['lateraloccipital','inferiortemporal','middletemporal','temporalpole'].map(n=>lateralPt(n,'L',0.45));
          addTube(dors,0xff6bd6,0.15,{arrow:true,depth:false});addTube(vent,0x5be3ff,0.15,{arrow:true,depth:false});
          camOn(90,10,44);
        }
        if(id==='hippo'){
          S.xray=true;S.hippoGrad=true;S.hl=new Map([['hippo',null]]);
          Object.keys(FAM).forEach(k=>{if(k!=='hippo'&&k!=='cortex')S.hidden.add(k);});
          const c=famCenter.hippo,sd=pickOne(r,[1,-1]);camOn(sd*74,22,34,V3(sd*c.x*0.5,c.y+0.4,c.z));
        }
        if(id==='radial'){
          const zc=0.6;quizCut('z',zc,false);
          const part=partOf('cortexL'),pos=part.geo.attributes.position.array,nr=part.geo.attributes.normal.array;
          const idxs=[];let cx=0,cy=0;
          for(let i=0;i<pos.length;i+=3)if(Math.abs(pos[i+2]-zc)<0.1&&pos[i]>0.3){idxs.push(i/3);cx+=pos[i];cy+=pos[i+1];}
          cx/=idxs.length;cy/=idxs.length;
          for(const deg of [15,40,65,90,115,-20,-45,-70]){
            const th=deg*DEG;let bi=-1,bs=-1e9;
            for(const vi of idxs){const dx=pos[vi*3]-cx,dy=pos[vi*3+1]-cy,a=Math.atan2(dy,dx),dd=Math.abs(Math.atan2(Math.sin(a-th),Math.cos(a-th)));if(dd<0.08){const rad=Math.hypot(dx,dy);if(rad>bs){bs=rad;bi=vi;}}}
            if(bi<0)continue;
            const p0=V3(pos[bi*3],pos[bi*3+1],zc+0.05),n=V3(nr[bi*3],nr[bi*3+1],0).normalize();
            const a0=p0.clone().addScaledVector(n,0.5),a1=p0.clone().addScaledVector(n,-1.1);
            addArrow([a0.x,a0.y,a0.z],[a1.x,a1.y,a1.z],0xffc46b,{r:0.1,head:0.9});
          }
          camOn(180,0,38,V3(3.5,0.5,0.6));
        }
      }};
  }
};
function makeQuestion(spec){
  const r=mulberry(spec.s);
  const q=GEN[spec.k](r);
  q.kind=spec.k;q.deck=KIND_DECK[spec.k];q.spec=spec;
  return q;
}
function newSpec(){
  const seed=Math.floor(Math.random()*1e9);
  let kind;
  if(QS.deck==='mixed')kind=pickWeighted(Math.random,MIX.filter(m=>m[0]!==QS.lastKind));
  else kind=pickOne(Math.random,KINDS[QS.deck].filter(k=>k!==QS.lastKind||KINDS[QS.deck].length===1));
  return{k:kind,s:seed};
}
function renderDeckBar(){
  $('#deckBar').innerHTML=DECKS.map(d=>'<button class="chip'+(QS.deck===d[0]?' on':'')+'" data-deck="'+d[0]+'">'+d[1]+'</button>').join('');
}
function renderStats(){
  const d=QS.data.decks;
  $('#qStats').innerHTML=Object.keys(DECK_NAME).map(k=>{
    const s=d[k]||{s:0,c:0},pct=s.s?Math.round(s.c/s.s*100):0;
    return '<div class="qs"><span>'+DECK_NAME[k]+'<b>'+(s.s?pct+'% · '+s.c+'/'+s.s:'new')+'</b></span><div class="bar"><i style="width:'+pct+'%"></i></div></div>';
  }).join('');
  const m=QS.data.misses.length,rv=$('#qReview');
  rv.hidden=!m&&!QS.reviewing;
  rv.textContent=QS.reviewing?'Leave review, back to new cards':'Review '+m+' missed card'+(m===1?'':'s');
  $('#qRing').innerHTML=QS.hist.slice(-10).map(h=>'<i class="'+(h?'ok':'no')+'"></i>').join('');
  $('#qCount').innerHTML='Card <b>'+(QS.n+1)+'</b> · '+QS.correct+' right'+(QS.streak>1?' · streak <b>'+QS.streak+'</b>':'');
}
function showQuestion(q){
  QS.cur=q;QS.answered=false;QS.revealed=false;
  resetScene();
  q.setup();applyPaint();
  $('#qTag').textContent=q.tag+(QS.reviewing?' · review':'');
  $('#qPrompt').textContent=q.prompt;
  $('#qSub').innerHTML=(q.quote?'<span class="qquote" style="display:block;margin-bottom:8px">'+esc(q.quote)+'</span>':'')+esc(q.sub||'');
  const typing=QS.ans==='type'&&!q.free;
  $('#qOpts').hidden=typing||!!q.free;$('#qType').hidden=!typing;$('#qFreeBox').hidden=!q.free;
  $('#qOpts').innerHTML=q.free?'':q.options.map((o,i)=>'<button class="opt" data-id="'+o.id+'"><kbd>'+(i+1)+'</kbd><span>'+esc(o.label)+'</span></button>').join('');
  const inp=$('#qInput');inp.value='';inp.disabled=false;inp.className='';QS.hint=0;
  $('#qHintLine').hidden=true;$('#qCheck').disabled=$('#qHint').disabled=$('#qGiveUp').disabled=false;
  $('#qFree').value='';$('#qFree').disabled=false;$('#qRevealBtn').disabled=false;
  $('#qSelf').hidden=true;$('#qOverride').hidden=true;$('#qNext').hidden=false;
  if(typing&&window.innerWidth>900)setTimeout(()=>{try{inp.focus({preventScroll:true});}catch(e){}},60);
  $('#qFeed').hidden=true;
  renderStats();
  layoutSoon();
}
function nextQuestion(){
  let spec;
  if(QS.reviewing){
    if(!QS.data.misses.length){QS.reviewing=false;spec=newSpec();}
    else spec=QS.data.misses[0];
  }else spec=newSpec();
  QS.lastKind=spec.k;
  showQuestion(makeQuestion(spec));
}
function startQuiz(){
  QS.n=0;QS.correct=0;QS.streak=0;QS.hist=[];QS.reviewing=false;
  renderDeckBar();syncAns();nextQuestion();
}
function countLine(){$('#qCount').innerHTML='Card <b>'+QS.n+'</b> · '+QS.correct+' right'+(QS.streak>1?' · streak <b>'+QS.streak+'</b>':'');}
/* score one card: deck totals, streak, and the missed-cards pile */
function record(ok){
  const q=QS.cur,D=QS.data.decks,k=q.deck;D[k]=D[k]||{s:0,c:0};D[k].s++;if(ok)D[k].c++;
  QS.prevStreak=QS.streak;
  QS.n++;if(ok){QS.correct++;QS.streak++;if(QS.streak>QS.data.best)QS.data.best=QS.streak;}else QS.streak=0;
  QS.hist.push(ok);
  const key=q.spec.k+':'+q.spec.s,ms=QS.data.misses;
  const idx=ms.findIndex(m=>m.k+':'+m.s===key);
  if(ok&&idx>=0)ms.splice(idx,1);
  if(!ok&&idx<0){ms.push(q.spec);if(ms.length>40)ms.shift();}
  saveQ();
}
function showFeedback(cls,verdict,lead){
  const q=QS.cur,v=$('#qVerdict');v.textContent=verdict;v.className='verdict '+cls;
  $('#qExplain').innerHTML=(lead||'')+q.explain;
  $('#qFeed').hidden=false;
  $('#qNext').textContent=QS.reviewing&&QS.data.misses.length?'Next missed card':'Next card';
  if(q.reveal)q.reveal();
  QS.n--;renderStats();QS.n++;countLine();
  layoutSoon();
}
function answerQuestion(id){
  if(QS.answered||!QS.cur)return;
  QS.answered=true;
  const q=QS.cur,ok=id===q.answer;
  $$('#qOpts .opt').forEach(b=>{
    b.disabled=true;
    if(b.dataset.id===q.answer)b.classList.add('right');
    else if(b.dataset.id===id)b.classList.add('wrong');
    else b.classList.add('dim');
  });
  record(ok);
  showFeedback(ok?'good':'bad',ok?'Correct':'Not quite');
}
function answerTyped(gaveUp){
  if(QS.answered||!QS.cur)return;
  const q=QS.cur,inp=$('#qInput'),text=inp.value.trim();
  if(!gaveUp&&!text){inp.focus();return;}
  const res=gaveUp?{ok:false,label:q.options.find(o=>o.id===q.answer).label}:matchTyped(q,text);
  QS.answered=true;
  inp.disabled=true;inp.className=res.ok?'right':'wrong';inp.blur();
  $('#qCheck').disabled=$('#qHint').disabled=$('#qGiveUp').disabled=true;
  record(res.ok);
  let lead='';
  if(gaveUp)lead='';
  else if(res.ok&&!res.exact)lead='You typed “'+esc(text)+'”. Accepted, and the full name is <b>'+esc(res.label)+'</b>. ';
  else if(!res.ok)lead='You typed “'+esc(text)+'”'+(res.other?', which is a different answer here ('+esc(res.other)+')':'')+'. ';
  showFeedback(res.ok?'good':gaveUp?'mid':'bad',res.ok?(QS.hint?'Correct, with a hint':'Correct'):gaveUp?'Here it is':'Not quite',lead);
  $('#qOverride').hidden=res.ok||gaveUp;
}
/* she can overrule the marker when a correct synonym was not recognised */
function overrideRight(){
  const q=QS.cur;if(!q||!QS.answered)return;
  const D=QS.data.decks[q.deck];D.c++;QS.correct++;QS.streak=(QS.prevStreak||0)+1;if(QS.streak>QS.data.best)QS.data.best=QS.streak;
  QS.hist[QS.hist.length-1]=true;
  const key=q.spec.k+':'+q.spec.s,ms=QS.data.misses,idx=ms.findIndex(m=>m.k+':'+m.s===key);if(idx>=0)ms.splice(idx,1);
  saveQ();
  $('#qOverride').hidden=true;$('#qInput').className='right';
  const v=$('#qVerdict');v.textContent='Counted as correct';v.className='verdict good';

}
function revealFree(){
  const q=QS.cur;if(!q||!q.free||QS.revealed)return;
  QS.revealed=true;$('#qFree').disabled=true;$('#qRevealBtn').disabled=true;
  const v=$('#qVerdict');v.textContent='Compare with yours';v.className='verdict mid';

$('#qType').addEventListener('submit',e=>{e.preventDefault();answerTyped(false);});
$('#qGiveUp').addEventListener('click',()=>answerTyped(true));

$('#qFreeBox').addEventListener('submit',e=>{e.preventDefault();revealFree();});

$('#ansSeg').addEventListener('click',e=>{

function syncAns(){$$('#ansSeg button').forEach(b=>b.classList.toggle('on',b.dataset.a===QS.ans));}
$('#qOpts').addEventListener('click',e=>{const b=e.target.closest('.opt');if(b)answerQuestion(b.dataset.id);});
$('#qNext').addEventListener('click',nextQuestion);
$('#deckBar').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;QS.deck=b.dataset.deck;QS.reviewing=false;QS.lastKind=null;renderDeckBar();nextQuestion();});
$('#qReview').addEventListener('click',()=>{QS.reviewing=!QS.reviewing;nextQuestion();renderDeckBar();});
window.addEventListener('keydown',e=>{
  if(app.dataset.mode!=='quiz')return;
  if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(e.target&&e.target.tagName==='BUTTON'&&(e.key==='Enter'||e.key===' '))return;
  if(!QS.answered&&/^[1-4]$/.test(e.key)){if($('#qOpts').hidden)return;const b=$$('#qOpts .opt')[+e.key-1];if(b)answerQuestion(b.dataset.id);}

});
let layoutT=0;function layoutSoon(){clearTimeout(layoutT);layoutT=setTimeout(layout,40);}
if(window.ResizeObserver){const ro=new ResizeObserver(()=>layoutSoon());ro.observe($('#side'));ro.observe($('#tools'));}

/* ============ boot ============ */

  requestAnimationFrame(tick);
  if(window.__NEURO_DEBUG){window.__dev=o=>{
    document.querySelectorAll('.panel,#top,#hint').forEach(e=>e.style.display=o.ui?'':'none');
    if(!o.ui){camera.clearViewOffset();camera.updateProjectionMatrix();}
    if(o.cut){S.lastAxis=o.cut.axis;S.cut=o.cut;A.pos=S.cut.flip?-o.cut.pos:o.cut.pos;}else{S.cut={axis:null,pos:0,flip:false};A.pos=DISABLED;}
    S.halves=!!o.halves;S.sep=o.sep||0;S.open=o.open||0;A.sep=S.sep;A.open=S.open;
    S.explode=o.explode||0;A.explode=S.explode;S.xray=!!o.xray;S.mode=o.mode||'natural';S.cortexSel=o.csel||null;setUnfold(o.unfold||0,true);
    S.hidden=new Set(o.hide||[]);S.hl=o.hl?new Map(o.hl.map(f=>[f,null])):null;A.focus=S.hl?1:0;
    applyPaint();
    tw=null;placeCam((o.az||0)*DEG,(o.el||0)*DEG,o.dist||40,o.target?V3(...o.target):HOME.target);
  };
  window.__neuro={matchTyped,selectLandmark,answerTyped,pickAt,layout,S,A,camera,controls,scene,renderer,parts,instances,setCut,flyTo,setMode,setSelection,GEN,makeQuestion,showQuestion,QS,view,regionInfo};}
})().catch(err=>{console.error(err);const t=$('#ldText');if(t)t.textContent='Something went wrong while loading the brain: '+err.message;});
})();
